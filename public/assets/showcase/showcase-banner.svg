<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="bShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0A0F1D" />

  <!-- Backdrop grid stage -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="600" />
    <line x1="750" y1="0" x2="750" y2="600" />
    <line x1="0" y1="520" x2="800" y2="520" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Large Horizontal Outdoor Spanduk / Banner Mockup -->
  <g transform="translate(60, 160)" filter="url(#bShadow)">
    <!-- Banner Cloth -->
    <rect width="680" height="250" rx="8" fill="url(#bGrad)" stroke="#38BDF8" stroke-width="2" />
    
    <!-- Metal Eyelets (mata ayam) on corners -->
    <circle cx="20" cy="20" r="7" fill="#E2E8F0" stroke="#475569" stroke-width="3" />
    <circle cx="340" cy="20" r="7" fill="#E2E8F0" stroke="#475569" stroke-width="3" />
    <circle cx="660" cy="20" r="7" fill="#E2E8F0" stroke="#475569" stroke-width="3" />
    <circle cx="20" cy="230" r="7" fill="#E2E8F0" stroke="#475569" stroke-width="3" />
    <circle cx="340" cy="230" r="7" fill="#E2E8F0" stroke="#475569" stroke-width="3" />
    <circle cx="660" cy="230" r="7" fill="#E2E8F0" stroke="#475569" stroke-width="3" />

    <!-- Content Inside Banner -->
    <g transform="translate(60, 45)">
      <!-- Badge -->
      <rect width="140" height="24" rx="12" fill="#FACC15" />
      <text x="70" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#0F172A">GRAND OPENING PROMO</text>
      
      <!-- Big Text -->
      <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="-1">UPGRADE BRANDING BISNIS ANDA</text>
      <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#BAE6FD">Desain Spanduk &amp; Banner Skala Penuh Standar Percetakan</text>
      
      <!-- CTA Button pill in banner -->
      <g transform="translate(0, 125)">
        <rect width="180" height="40" rx="10" fill="#FFFFFF" />
        <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#0369A1">ORDER VIA WA</text>
      </g>
      <text x="200" y="150" font-family="monospace" font-size="14" font-weight="700" fill="#F8FAFC">0857-7573-5769</text>
    </g>

    <!-- Decorative Illustration on Right of Banner -->
    <g transform="translate(540, 45)">
      <circle cx="60" cy="80" r="55" fill="#38BDF8" opacity="0.3" />
      <circle cx="60" cy="80" r="35" fill="#FFFFFF" opacity="0.2" />
      <!-- Star/burst vector -->
      <path d="M 60 20 L 70 65 L 115 65 L 80 90 L 95 135 L 60 105 L 25 135 L 40 90 L 5 65 L 50 65 Z" fill="#FACC15" />
    </g>
  </g>

  <!-- Hanging ropes top corners -->
  <line x1="80" y1="0" x2="80" y2="160" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="720" y1="0" x2="720" y2="160" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Spec Label Bottom -->
  <g transform="translate(260, 470)">
    <rect width="280" height="40" rx="20" fill="#1E293B" stroke="#334155" />
    <text x="140" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Skala 1:1 • Flexi 280g / Korea 440g</text>
  </g>
</svg>
