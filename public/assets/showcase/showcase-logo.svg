<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B66FF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid Blueprint lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <circle cx="400" cy="300" r="180" fill="none" stroke="#3B66FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
  </g>

  <!-- Main Stationery Card Mockup -->
  <g transform="translate(160, 90)" filter="url(#shadow)">
    <rect width="480" height="340" rx="20" fill="url(#cardGrad)" />
    <!-- Subtle card deboss effect -->
    <rect x="20" y="20" width="440" height="300" rx="14" fill="none" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Modern Emblem -->
    <g transform="translate(190, 70)">
      <rect width="100" height="100" rx="24" fill="#0A0A0A" />
      <!-- Stylized P Emblem -->
      <path d="M 32 26 L 56 26 C 68 26 76 34 76 46 C 76 58 68 64 56 64 L 44 64 L 44 76" stroke="url(#blueGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="76" cy="74" r="6" fill="#60A5FA" />
    </g>

    <!-- Typography -->
    <text x="240" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="24" fill="#0F172A" letter-spacing="2">PSA DIGITAL</text>
    <text x="240" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#3B66FF" letter-spacing="5">BRAND IDENTITY &amp; GUIDELINES</text>

    <!-- Specs indicator pills -->
    <g transform="translate(90, 275)">
      <rect width="85" height="24" rx="12" fill="#EEF2FF" />
      <text x="42.5" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#3B66FF">VECTOR MASTER</text>
    </g>
    <g transform="translate(195, 275)">
      <rect width="90" height="24" rx="12" fill="#F1F5F9" />
      <text x="45" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#475569">COLOR SYSTEM</text>
    </g>
    <g transform="translate(305, 275)">
      <rect width="85" height="24" rx="12" fill="#ECFDF5" />
      <text x="42.5" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#059669">300 DPI READY</text>
    </g>
  </g>

  <!-- Color Palette Swatches floating left -->
  <g transform="translate(60, 390)" filter="url(#shadow)">
    <rect width="170" height="150" rx="14" fill="#FFFFFF" />
    <text x="18" y="28" font-family="sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="1">COLOR PALETTE</text>
    
    <circle cx="35" cy="60" r="15" fill="#0A0A0A" />
    <text x="60" y="64" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">#0A0A0A</text>
    
    <circle cx="35" cy="98" r="15" fill="#3B66FF" />
    <text x="60" y="102" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">#3B66FF</text>
    
    <circle cx="35" cy="132" r="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <text x="60" y="135" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">#F8FAFC</text>
  </g>

  <!-- Floating Badge Right -->
  <g transform="translate(560, 420)" filter="url(#shadow)">
    <rect width="180" height="90" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="32" cy="45" r="14" fill="#3B66FF" />
    <path d="M 26 45 L 30 49 L 39 40" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="56" y="38" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">100% Scalable</text>
    <text x="56" y="55" font-family="sans-serif" font-size="10" fill="#94A3B8">AI, SVG, EPS, PNG</text>
  </g>
</svg>
