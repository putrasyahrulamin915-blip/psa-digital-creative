<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="xbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="xbShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0B1120" />

  <!-- X-Frame Stand Behind -->
  <g stroke="#94A3B8" stroke-width="6" stroke-linecap="round">
    <!-- X Crossing Poles -->
    <line x1="260" y1="90" x2="540" y2="480" />
    <line x1="540" y1="90" x2="260" y2="480" />
    <!-- Center Hub Joint -->
    <circle cx="400" cy="285" r="16" fill="#0F172A" stroke="#CBD5E1" stroke-width="4" />
    <!-- Rear Tripod Leg -->
    <line x1="400" y1="285" x2="400" y2="530" stroke="#64748B" stroke-width="8" />
  </g>

  <!-- Vertical Banner Canvas (60 x 160 cm ratio) -->
  <g transform="translate(290, 60)" filter="url(#xbShadow)">
    <rect width="220" height="440" rx="8" fill="url(#xbGrad)" stroke="#60A5FA" stroke-width="2" />
    
    <!-- 4 Corner Eyelets hooked to frame -->
    <circle cx="16" cy="16" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <circle cx="204" cy="16" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <circle cx="16" cy="424" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <circle cx="204" cy="424" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />

    <!-- Content Inside X-Banner -->
    <g transform="translate(20, 40)">
      <rect width="80" height="18" rx="9" fill="#FACC15" />
      <text x="40" y="13" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#0F172A">PROMOSI EVENT</text>

      <text x="0" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">X-BANNER</text>
      <text x="0" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#93C5FD">STAND SET</text>
      
      <line x1="0" y1="95" x2="180" y2="95" stroke="#3B82F6" stroke-width="2" />

      <!-- Graphic Showcase -->
      <g transform="translate(15, 120)">
        <rect width="150" height="110" rx="8" fill="#1E293B" />
        <circle cx="75" cy="55" r="30" fill="#2563EB" opacity="0.3" />
        <path d="M 60 55 L 70 65 L 90 45" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" fill="none" />
        <text x="75" y="95" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#E2E8F0">PORTABLE DISPLAY</text>
      </g>

      <g transform="translate(0, 260)">
        <text x="0" y="15" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">• Lengkap Rangka Fiber</text>
        <text x="0" y="32" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">• Bahan Flexi / Albatros</text>
        <text x="0" y="49" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">• Sarung Tas Jinjing</text>
      </g>

      <!-- Bottom CS WA Pill -->
      <g transform="translate(10, 335)">
        <rect width="160" height="30" rx="15" fill="#FFFFFF" />
        <text x="80" y="19" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="900" fill="#1D4ED8">PESAN LENGKAP</text>
      </g>
    </g>
  </g>

  <!-- Left info card -->
  <g transform="translate(60, 240)">
    <rect width="180" height="80" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="20" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#38BDF8">PAKET STAND SET</text>
    <text x="20" y="52" font-family="sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">Rp175.000 / unit</text>
    <text x="20" y="68" font-family="sans-serif" font-size="9" fill="#94A3B8">Siap pakai untuk booth pameran</text>
  </g>
</svg>
