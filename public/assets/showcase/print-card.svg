<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="cShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#090D16" />

  <!-- Background decorative lines -->
  <circle cx="400" cy="300" r="240" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Business Card 1: Front (Dark/Executive) Floating Top Left -->
  <g transform="translate(100, 110) rotate(-6)" filter="url(#cShadow)">
    <rect width="360" height="210" rx="14" fill="url(#cardDark)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Accent line -->
    <rect x="0" y="0" width="8" height="210" rx="4" fill="#3B66FF" />

    <!-- Logo and brand -->
    <g transform="translate(35, 40)">
      <rect width="44" height="44" rx="12" fill="#1E293B" stroke="#3B66FF" stroke-width="1.5" />
      <path d="M 16 14 L 28 14 C 33 14 36 17 36 22 C 36 27 33 30 28 30 L 22 30 L 22 35" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="36" cy="34" r="2.5" fill="#60A5FA" />
      
      <text x="56" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">PSA DIGITAL</text>
      <text x="56" y="38" font-family="sans-serif" font-size="8" font-weight="700" fill="#3B66FF" letter-spacing="3">SMART CREATIVE</text>
    </g>

    <!-- Name & Title -->
    <g transform="translate(35, 125)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="900" fill="#FFFFFF">PUTRA SYAHRUL AMIN</text>
      <text x="0" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">Founder &amp; Creative Lead</text>
    </g>

    <!-- QR Code in corner -->
    <g transform="translate(285, 125)">
      <rect width="46" height="46" rx="6" fill="#FFFFFF" />
      <rect x="6" y="6" width="14" height="14" fill="#0A0A0A" />
      <rect x="26" y="6" width="14" height="14" fill="#0A0A0A" />
      <rect x="6" y="26" width="14" height="14" fill="#0A0A0A" />
      <rect x="23" y="23" width="7" height="7" fill="#3B66FF" />
    </g>
  </g>

  <!-- Business Card 2: Back (Clean Crisp White/Spot UV) Floating Bottom Right -->
  <g transform="translate(340, 260) rotate(5)" filter="url(#cShadow)">
    <rect width="360" height="210" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Minimalist Centerpiece -->
    <g transform="translate(180, 80)">
      <circle cx="0" cy="0" r="32" fill="#0A0A0A" />
      <!-- Stylized Monogram P -->
      <path d="M -8 -12 L 3 -12 C 9 -12 14 -8 14 0 C 14 8 9 12 3 12 L -2 12 L -2 18" stroke="#3B66FF" stroke-width="4" stroke-linecap="round" fill="none" />
      <circle cx="12" cy="16" r="3" fill="#60A5FA" />
      
      <text x="0" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#0F172A" letter-spacing="1">PSA.ID</text>
      <text x="0" y="62" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#64748B" letter-spacing="3">DIGITAL CREATIVE</text>
    </g>

    <!-- Footer contact bar -->
    <g transform="translate(30, 175)">
      <text x="0" y="0" font-family="sans-serif" font-size="9" font-weight="700" fill="#0F172A">WA: 0857-7573-5769</text>
      <text x="180" y="0" font-family="sans-serif" font-size="9" font-weight="700" fill="#3B66FF">www.psadigital.com</text>
    </g>
  </g>

  <!-- Badge Info -->
  <g transform="translate(80, 480)">
    <rect width="260" height="38" rx="19" fill="#1E293B" stroke="#334155" />
    <text x="130" y="24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#94A3B8">Art Carton 310g • Finishing Doff / Spot UV</text>
  </g>
</svg>
