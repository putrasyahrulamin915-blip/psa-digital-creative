<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="igShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0A0F1D" />

  <!-- Multi-slide seamless carousel mockup (Slide 1, Slide 2, Slide 3 connected) -->
  <g transform="translate(60, 110)" filter="url(#igShadow)">
    
    <!-- Seamless Background spanning all 3 slides -->
    <rect width="680" height="380" rx="20" fill="url(#igGrad)" />

    <!-- Slide Dividers showing seamless connected design -->
    <line x1="226" y1="0" x2="226" y2="380" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
    <line x1="453" y1="0" x2="453" y2="380" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

    <!-- Connected Fluid Wave linking Slide 1 to 2 to 3 -->
    <path d="M 0 240 Q 150 180, 226 250 T 453 230 T 680 200 L 680 380 L 0 380 Z" fill="#0A0A0A" opacity="0.35" />

    <!-- SLIDE 1 (Left: Cover Hook) -->
    <g transform="translate(20, 20)">
      <!-- IG Profile bar -->
      <circle cx="16" cy="16" r="16" fill="#FFFFFF" />
      <circle cx="16" cy="16" r="12" fill="#3B66FF" />
      <text x="40" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">psa.digital</text>
      <text x="40" y="26" font-family="sans-serif" font-size="8" fill="#E2E8F0">Creative Agency</text>
      <text x="185" y="18" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF">1/5</text>

      <!-- Hook content -->
      <rect x="0" y="60" width="80" height="20" rx="10" fill="#FFFFFF" />
      <text x="40" y="74" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#3B66FF">TIPS DESAIN</text>
      
      <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">CARA BIKIN</text>
      <text x="0" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FACC15">FEED AUTO</text>
      <text x="0" y="179" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">RAMAI OMSET</text>

      <g transform="translate(0, 290)">
        <text x="0" y="0" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Swipe ke kanan &rarr;</text>
      </g>
    </g>

    <!-- SLIDE 2 (Center: Educational Content) -->
    <g transform="translate(246, 20)">
      <text x="185" y="18" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF">2/5</text>
      
      <rect x="0" y="60" width="186" height="50" rx="10" fill="#FFFFFF" opacity="0.15" />
      <text x="15" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">#1. Hook di 3 Detik</text>
      <text x="15" y="100" font-family="sans-serif" font-size="9" fill="#E0F2FE">Gunakan kontras warna tegas.</text>

      <rect x="0" y="125" width="186" height="50" rx="10" fill="#FFFFFF" opacity="0.15" />
      <text x="15" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">#2. Seamless Carousel</text>
      <text x="15" y="165" font-family="sans-serif" font-size="9" fill="#E0F2FE">Elemen visual tersambung.</text>

      <rect x="0" y="190" width="186" height="50" rx="10" fill="#FFFFFF" opacity="0.15" />
      <text x="15" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">#3. Clear Call to Action</text>
      <text x="15" y="230" font-family="sans-serif" font-size="9" fill="#E0F2FE">Arahkan chat langsung.</text>
    </g>

    <!-- SLIDE 3 (Right: Call to Action) -->
    <g transform="translate(473, 20)">
      <text x="185" y="18" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF">3/5</text>
      
      <circle cx="93" cy="110" r="45" fill="#FFFFFF" />
      <!-- Megaphone / Rocket Icon -->
      <polygon points="75,110 100,90 100,130" fill="#3B66FF" />
      <circle cx="115" cy="110" r="8" fill="#FACC15" />

      <text x="93" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">ORDER SEKARANG</text>
      <text x="93" y="202" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#E0F2FE">Paket 1, 5, atau 10 Post</text>

      <g transform="translate(25, 235)">
        <rect width="136" height="34" rx="17" fill="#FFFFFF" />
        <text x="68" y="21" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="900" fill="#3B66FF">HUBUNGI PSA</text>
      </g>
    </g>
  </g>

  <!-- Spec Label Top -->
  <g transform="translate(270, 50)">
    <rect width="260" height="36" rx="18" fill="#1E293B" stroke="#334155" />
    <text x="130" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#67E8F9">Carousel 1:1 (1080x1080) &amp; Story 9:16</text>
  </g>
</svg>
