<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="brochureShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0F172A" />

  <!-- Tri-fold Brochure 3 Panels Mockup in Isometric/Perspective Layout -->
  <g transform="translate(100, 100)" filter="url(#brochureShadow)">
    
    <!-- Panel 1 (Left panel - inside flap) -->
    <g transform="translate(0, 30) skewY(6)">
      <rect width="190" height="340" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="20" y="25" width="150" height="80" rx="6" fill="#3B82F6" opacity="0.15" />
      <text x="30" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#1E40AF">TENTANG KAMI</text>
      <line x1="30" y1="65" x2="80" y2="65" stroke="#3B82F6" stroke-width="2" />
      <!-- Dummy text lines -->
      <rect x="20" y="125" width="140" height="8" rx="4" fill="#CBD5E1" />
      <rect x="20" y="145" width="120" height="8" rx="4" fill="#E2E8F0" />
      <rect x="20" y="165" width="135" height="8" rx="4" fill="#E2E8F0" />
      <rect x="20" y="185" width="110" height="8" rx="4" fill="#E2E8F0" />

      <!-- Feature points -->
      <circle cx="28" cy="225" r="4" fill="#3B66FF" />
      <rect x="40" y="222" width="110" height="7" rx="3" fill="#64748B" />
      <circle cx="28" cy="245" r="4" fill="#3B66FF" />
      <rect x="40" y="242" width="95" height="7" rx="3" fill="#64748B" />
      <circle cx="28" cy="265" r="4" fill="#3B66FF" />
      <rect x="40" y="262" width="120" height="7" rx="3" fill="#64748B" />
    </g>

    <!-- Panel 2 (Center panel) -->
    <g transform="translate(195, 10)">
      <rect width="210" height="360" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="20" y="25" width="170" height="110" rx="8" fill="#0A0A0A" />
      <circle cx="105" cy="70" r="28" fill="#3B66FF" />
      <path d="M 98 70 L 103 75 L 114 64" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
      <text x="105" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">SOLUSI DIGITAL</text>

      <text x="25" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#0F172A">COMPANY PROFILE</text>
      <text x="25" y="183" font-family="sans-serif" font-size="10" font-weight="600" fill="#3B66FF">Katalog Layanan &amp; Profil</text>
      
      <rect x="25" y="205" width="160" height="6" rx="3" fill="#E2E8F0" />
      <rect x="25" y="220" width="145" height="6" rx="3" fill="#E2E8F0" />
      <rect x="25" y="235" width="155" height="6" rx="3" fill="#E2E8F0" />

      <!-- Stats row -->
      <g transform="translate(25, 260)">
        <rect width="70" height="50" rx="6" fill="#F1F5F9" />
        <text x="35" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#0F172A">99%</text>
        <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">Kepuasan</text>

        <rect x="85" y="0" width="75" height="50" rx="6" fill="#EEF2FF" />
        <text x="122" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="900" fill="#3B66FF">500+</text>
        <text x="122" y="40" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#3B66FF">Klien Aktif</text>
      </g>
    </g>

    <!-- Panel 3 (Right panel - Front Cover) -->
    <g transform="translate(410, 30) skewY(-6)">
      <rect width="190" height="340" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <!-- Modern Cover Graphics -->
      <circle cx="95" cy="110" r="55" fill="none" stroke="#3B66FF" stroke-width="3" />
      <circle cx="95" cy="110" r="40" fill="#1E293B" />
      <!-- Logo P -->
      <path d="M 85 95 L 100 95 C 108 95 112 100 112 106 C 112 112 108 116 100 116 L 93 116 L 93 125" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" fill="none" />
      
      <text x="95" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">PSA CREATIVE</text>
      <text x="95" y="215" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#93C5FD" letter-spacing="3">DIGITAL BROCHURE</text>

      <rect x="40" y="245" width="110" height="30" rx="8" fill="#3B66FF" />
      <text x="95" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">PROFIL RESMI</text>
      
      <text x="95" y="310" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748B">www.psadigital.com</text>
    </g>

  </g>

  <!-- Specs Tag -->
  <g transform="translate(290, 520)">
    <rect width="220" height="36" rx="18" fill="#1E293B" stroke="#334155" />
    <text x="110" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#94A3B8">Lipat 2 / Lipat 3 • Art Paper 150g</text>
  </g>
</svg>
