<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFD" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="invShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="#0B0F19" />

  <!-- Background elegant botanical floral accents -->
  <g stroke="#334155" stroke-width="1" opacity="0.25" fill="none">
    <circle cx="400" cy="300" r="260" stroke-dasharray="8 8" />
  </g>

  <!-- Envelope Mockup (Behind) -->
  <g transform="translate(180, 50)" filter="url(#invShadow)">
    <polygon points="0,120 220,240 440,120 440,380 0,380" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <polygon points="0,120 220,240 440,120 220,0" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <!-- Wax seal mockup -->
    <circle cx="220" cy="240" r="20" fill="#B45309" />
    <circle cx="220" cy="240" r="16" fill="url(#goldGrad)" />
    <text x="220" y="246" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="14" font-weight="900" fill="#78350F">P</text>
  </g>

  <!-- Elegant Invitation Card (Front) -->
  <g transform="translate(240, 100)" filter="url(#invShadow)">
    <rect width="320" height="440" rx="16" fill="url(#invBg)" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Gold Border Inset -->
    <rect x="16" y="16" width="288" height="408" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <rect x="20" y="20" width="280" height="400" rx="8" fill="none" stroke="#FDE68A" stroke-width="0.8" />

    <!-- Corner Decorative Florals -->
    <path d="M 28 40 C 40 32 45 45 55 35" stroke="#D97706" stroke-width="1.2" fill="none" />
    <path d="M 292 40 C 280 32 275 45 265 35" stroke="#D97706" stroke-width="1.2" fill="none" />

    <!-- Content -->
    <text x="160" y="65" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#B45309" letter-spacing="4">THE WEDDING OF</text>
    
    <!-- Script style names -->
    <text x="160" y="125" text-anchor="middle" font-family="serif" font-style="italic" font-size="34" font-weight="700" fill="#0F172A">Rizky &amp; Sarah</text>
    
    <line x1="120" y1="145" x2="200" y2="145" stroke="#D97706" stroke-width="1" />
    <polygon points="160,142 163,145 160,148 157,145" fill="#D97706" />

    <text x="160" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748B">KAMIS, 24 DESEMBER 2026</text>
    <text x="160" y="198" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94A3B8">Pukul 09.00 WIB - Selesai</text>
    
    <text x="160" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#0F172A">GRAND BALLROOM HOTEL</text>
    <text x="160" y="256" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">Jakarta Selatan</text>

    <!-- Digital QR Link Box -->
    <g transform="translate(130, 280)">
      <rect width="60" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <rect x="8" y="8" width="16" height="16" fill="#0F172A" />
      <rect x="36" y="8" width="16" height="16" fill="#0F172A" />
      <rect x="8" y="36" width="16" height="16" fill="#0F172A" />
      <rect x="30" y="30" width="8" height="8" fill="#B45309" />
    </g>
    <text x="160" y="358" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#B45309">SCAN UNTUK E-INVITE</text>

    <!-- Footer -->
    <text x="160" y="395" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94A3B8">Format Cetak Offset + Gambar Story WhatsApp</text>
  </g>

  <!-- Left info pill -->
  <g transform="translate(60, 470)">
    <rect width="210" height="36" rx="18" fill="#1E293B" stroke="#334155" />
    <text x="105" y="22" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#FDE68A">Jasmine Pearl / Linen Paper</text>
  </g>
</svg>
